name: ChecklistRewardSlot
description: Every checklist reward category placed into the pool, spread across excluded and default boxes in three modes at once, so the useful/filler reward split that drives the needs-default budget is exercised end to end
game: Kirby Air Ride
requires:
  version: 0.5.0
Kirby Air Ride:
  # Empty by default, so a category has to be named for any reward to reach the pool at all.
  checklist_rewards:
    - Sound Test
    - Music
    - Filler Boxes
    - Endings
    - Gameplay Extras
  city_trial_goal: 100_checklist_blocks
  air_ride_goal: 100_checklist_blocks
  top_ride_goal: n_checklist_blocks
  top_ride_checklist_amount: 60
  top_ride_checkbox_fillers: 0
  # Progression flags deliberately split: high-effort/free-run boxes stay EXCLUDED in City Trial and
  # Top Ride but become DEFAULT in Air Ride, so one seed carries filler rewards on excluded boxes
  # (which offset the generic filler minted there) and useful rewards on default boxes (which compete
  # with progression for the needs-default budget).
  city_trial_progression_high_effort: false
  city_trial_progression_free_run: false
  air_ride_progression_high_effort: true
  air_ride_progression_free_run: true
  air_ride_progression_time_attack: true
  top_ride_progression_high_effort: false
  # Gates that own an overlapping reward, one on and one off, so both reconciliation paths run while
  # the rest of the rewards are in the pool.
  machines_gated: true
  top_ride_items_gated: false
  city_trial_stadiums_gated: true
  city_trial_events_gated: true
  abilities_gated: true
  city_trial_patches_gated: true
  city_trial_boxes_gated: true
  air_ride_courses_gated: true
  top_ride_courses_gated: true
  colors_gated: true
  # A user exclude on a box whose native reward is *useful*, so a user exclude and a mode-level
  # progression flag both land on the excluded-box accounting in the same seed.
  exclude_locations:
    - "City Trial: race over 60 miles!"
