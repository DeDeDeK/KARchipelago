name: APChecklistSlot
description: Archipelago checklist as a real goal alongside City Trial and Air Ride, with every gate the AP boxes key on turned on — machine/character rules, the Mic pair, per-color box counts, the all-colors race and the Nebula Belt / Fantasy Meadows course boxes
game: Kirby Air Ride
requires:
  version: 0.5.0
Kirby Air Ride:
  city_trial_goal: n_checklist_blocks
  city_trial_checklist_amount: 40
  city_trial_checkbox_fillers: 0
  air_ride_goal: n_checklist_blocks
  air_ride_checklist_amount: 40
  air_ride_checkbox_fillers: 0
  top_ride_goal: none
  archipelago_goal: n_checklist_blocks
  archipelago_checklist_amount: 40
  archipelago_checkbox_fillers: 0
  # Every gate the Archipelago rules read. base_abilities_gated is what makes Charge a key, so it
  # also exercises the charge-dependent machine starter exclusion and the "some machine to ride"
  # split; abilities_gated + city_trial_items_gated + city_trial_boxes_gated together are what the
  # per-color box guards nest under.
  city_trial_stadiums_gated: true
  city_trial_events_gated: true
  abilities_gated: true
  base_abilities_gated: true
  city_trial_patches_gated: true
  city_trial_items_gated: true
  machines_gated: true
  city_trial_boxes_gated: true
  air_ride_courses_gated: true
  colors_gated: true
