name: MaxStatsSlot
description: Max Stats in one run — a patch cap climbing 1 -> 30 (29 Patch Cap Increase items), a spawn rate climbing 100 -> 300 (20 Spawn Rate Up items), and every gate off so the pool is dominated by those two stacks
game: Kirby Air Ride
requires:
  version: 0.5.0
Kirby Air Ride:
  # Every gate off, so the pool is almost entirely Patch Cap Increase and Spawn Rate Up - the one
  # fixture where progression is a pair of deep counted stacks rather than a spread of unlocks.
  city_trial_goal: max_stats_in_one_run
  city_trial_patch_cap_min: 1
  city_trial_patch_cap_max: 30
  spawn_rate_min: 100
  spawn_rate_max: 300
  air_ride_goal: n_checklist_blocks
  air_ride_checklist_amount: 20
  top_ride_goal: n_checklist_blocks
  top_ride_checklist_amount: 20
  city_trial_events_gated: false
  abilities_gated: false
  base_abilities_gated: false
  city_trial_patches_gated: false
  city_trial_items_gated: false
  machines_gated: false
  city_trial_boxes_gated: false
  air_ride_courses_gated: false
  colors_gated: false
  top_ride_courses_gated: false
  top_ride_items_gated: false
  city_trial_stadiums_gated: false
  allowed_items:
    - City Trial Item Gives
    - City Trial Event Gives
    - Copy Ability Gives
    - Top Ride Item Gives
