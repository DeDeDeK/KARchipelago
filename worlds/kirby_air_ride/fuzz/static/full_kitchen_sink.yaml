name: SinkSlot
description: Combines plando + start_inventory + local/non_local + exclude/priority on a CT+AR+TR multi-mode setup
game: Kirby Air Ride
requires:
  version: 0.5.0
Kirby Air Ride:
  city_trial_goal: 100_checklist_blocks
  air_ride_goal: n_checklist_blocks
  air_ride_checklist_amount: 40
  air_ride_checkbox_fillers: 3
  top_ride_goal: n_checklist_blocks
  top_ride_checklist_amount: 40
  top_ride_checkbox_fillers: 3
  city_trial_events_gated: true
  abilities_gated: true
  city_trial_patches_gated: true
  machines_gated: true
  city_trial_boxes_gated: true
  air_ride_courses_gated: true
  top_ride_courses_gated: true
  colors_gated: true
  top_ride_items_gated: true
  city_trial_items_gated: true
  city_trial_stadiums_gated: true
  trap_chance: 25
  spawn_rate_min: 100
  spawn_rate_max: 300
  # The AP Patch band at its default placement, the counterpart to ap_patches.yaml's excluded one:
  # 60 patches split into three chained group regions that can hold progression like any other box.
  ap_patches: 60
  ap_patch_placement: default
  # The progression sub-flags no other fixture turns on, so every one of the thirteen is exercised
  # somewhere. The six left out here (high effort / free run in City Trial, high effort / free run /
  # time attack in Air Ride, high effort in Top Ride) stay off on purpose, so this seed still carries
  # a mix of DEFAULT and EXCLUDED boxes rather than flattening into all-default.
  city_trial_progression_multiplayer: true
  city_trial_progression_rng: true
  city_trial_progression_bust_vehicles: true
  air_ride_progression_rng: true
  top_ride_progression_free_run: true
  top_ride_progression_time_attack: true
  top_ride_progression_multiplayer: true
  # Pure slot_data passthrough, but nothing else ships them as non-defaults, so a rename would go
  # unnoticed by every fixture.
  city_trial_reveal_checklist: true
  air_ride_reveal_checklist: true
  top_ride_reveal_checklist: true
  archipelago_reveal_checklist: true
  death_link: true
  energy_link: true
  trap_link: true
  start_inventory:
    "Unlock Stadium: HIGH JUMP": 1
    "Unlock Patch: Top Speed": 1
  local_items:
    - "City Trial Event Unlocks"
  non_local_items:
    - "Color Unlocks"
  exclude_locations:
    - "City Trial: Bust the star pole!"
  priority_locations:
    - "Air Ride: Race all of the standard Air Ride courses!"
  # Not the box the item gates, and force: true so an impossible pin fails loudly instead of being
  # quietly re-homed - see the note in plando_items.yaml.
  plando_items:
    - item: "Unlock Event: Tac"
      location: "City Trial: During one game, fly through the rings in the sky 5 times or more!"
      from_pool: true
      force: true
      percentage: 100
